server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # O worker do pdf.js é um arquivo .mjs; o nginx não mapeia .mjs por padrão,
  # o que faz o navegador recusar o module worker com MIME type errado.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
